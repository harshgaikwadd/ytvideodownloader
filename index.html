<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Media Downloader</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl text-center">
    <h1 class="text-3xl font-bold text-red-500 mb-2">Media Downloader</h1>
    <p class="text-slate-400 text-sm mb-6">Unlimited Video & MP3 Downloads • Ad-Free & Direct</p>

    <div class="flex gap-2 mb-4">
      <input type="text" id="videoUrl" placeholder="Paste YouTube link here..." 
             class="w-full px-4 py-2 bg-slate-800 text-white rounded-lg border border-slate-700 focus:outline-none focus:border-red-500 text-sm">
      <button onclick="fetchMetadata()" class="bg-red-600 hover:bg-red-700 text-white font-medium px-4 py-2 rounded-lg text-sm flex items-center justify-center min-w-[70px]">
        <span id="btnText">Fetch</span>
        <div id="spinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
      </button>
    </div>

    <!-- Preview Container -->
    <div id="resultContainer" class="hidden mt-6 text-left border-t border-slate-800 pt-4">
      <img id="thumb" class="w-full rounded-lg mb-3 shadow" src="" alt="Thumbnail">
      <h3 id="videoTitle" class="font-semibold text-slate-100 text-sm line-clamp-2 mb-1"></h3>
      <p id="videoAuthor" class="text-xs text-slate-400 mb-4"></p>

      <div class="flex gap-2 mb-3">
        <!-- Custom Styled Dropdown Container -->
        <div class="relative w-full">
          <select id="qualitySelect" class="w-full appearance-none bg-slate-800 border border-slate-700 text-slate-100 text-sm rounded-lg py-2.5 pl-3 pr-10 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition-all cursor-pointer shadow-inner">
            <option value="720" class="bg-slate-900 text-slate-100 py-1">720p HD (MP4)</option>
            <option value="360" class="bg-slate-900 text-slate-100 py-1">360p (MP4)</option>
            <option value="audio" class="bg-slate-900 text-slate-100 py-1">Audio Only (M4A)</option>
          </select>

          <!-- Custom SVG Arrow Icon -->
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
            <svg class="w-4 h-4 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
              <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/>
            </svg>
          </div>
        </div>

        <button id="downloadBtn" onclick="downloadMedia()" class="bg-green-600 hover:bg-green-700 text-white text-sm font-semibold px-4 py-2 rounded-lg w-full flex items-center justify-center">
          <span id="dlText">Download</span>
          <div id="dlSpinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
        </button>
      </div>
    </div>
  </div>

  <script>
    let currentVideoId = '';
    let fetchedStreams = [];

    async function fetchMetadata() {
      const urlInput = document.getElementById('videoUrl').value.trim();
      if (!urlInput) return alert('Please enter a YouTube URL');

      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = urlInput.match(regExp);
      currentVideoId = (match && match[2].length === 11) ? match[2] : null;

      if (!currentVideoId) return alert('Invalid YouTube URL format');

      document.getElementById('btnText').classList.add('hidden');
      document.getElementById('spinner').classList.remove('hidden');

      const proxy = 'https://corsproxy.io/?';
      const instances = [
        'https://inv.tux.pizza',
        'https://invidious.nerdvpn.de',
        'https://inv.hostux.net'
      ];

      let data = null;
      for (const instance of instances) {
        try {
          const apiUrl = encodeURIComponent(`${instance}/api/v1/videos/${currentVideoId}`);
          const res = await fetch(`${proxy}${apiUrl}`);
          if (res.ok) {
            data = await res.json();
            if (data && data.title) break;
          }
        } catch (e) {
          continue;
        }
      }

      document.getElementById('btnText').classList.remove('hidden');
      document.getElementById('spinner').classList.add('hidden');

      if (!data) return alert('Failed to retrieve video details. Please check the URL.');

      fetchedStreams = data.formatStreams || [];
      document.getElementById('thumb').src = `https://img.youtube.com/vi/${currentVideoId}/hqdefault.jpg`;
      document.getElementById('videoTitle').innerText = data.title;
      document.getElementById('videoAuthor').innerText = `Channel: ${data.author}`;
      document.getElementById('resultContainer').classList.remove('hidden');
    }

    function downloadMedia() {
      if (!currentVideoId) return alert('Fetch video details first');
      const selectedFormat = document.getElementById('qualitySelect').value;

      if (selectedFormat === 'audio') {
        const audioUrl = `https://inv.tux.pizza/latest_version?id=${currentVideoId}&itag=140`;
        window.open(audioUrl, '_blank');
        return;
      }

      const matchingStream = fetchedStreams.find(s => s.qualityLabel && s.qualityLabel.includes(selectedFormat));
      if (matchingStream && matchingStream.url) {
        window.open(matchingStream.url, '_blank');
      } else {
        const fallbackUrl = `https://inv.tux.pizza/latest_version?id=${currentVideoId}&itag=22`;
        window.open(fallbackUrl, '_blank');
      }
    }
  </script>
</body>
</html>
