<script>
  async function fetchMetadata() {
    const urlInput = document.getElementById('videoUrl').value.trim();
    if (!urlInput) return alert('Please enter a YouTube URL');

    // Extract 11-character Video ID
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = urlInput.match(regExp);
    const videoId = (match && match[2].length === 11) ? match[2] : null;

    if (!videoId) return alert('Invalid YouTube URL');

    document.getElementById('btnText').classList.add('hidden');
    document.getElementById('spinner').classList.remove('hidden');

    try {
      // Use YouTube oEmbed API directly from the browser
      const response = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
      const data = await response.json();

      if (data.error) throw new Error('Video not found');

      document.getElementById('thumb').src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
      document.getElementById('videoTitle').innerText = data.title;
      document.getElementById('videoDuration').innerText = `Author: ${data.author_name}`;
      document.getElementById('resultContainer').classList.remove('hidden');

      // Store active video ID on download button
      document.getElementById('downloadBtn').setAttribute('data-id', videoId);
    } catch (err) {
      alert('Failed to fetch details');
    } finally {
      document.getElementById('btnText').classList.remove('hidden');
      document.getElementById('spinner').classList.add('hidden');
    }
  }

  function downloadVideo() {
    const videoId = document.getElementById('downloadBtn').getAttribute('data-id');
    const quality = document.getElementById('qualitySelect').value;

    if (!videoId) return alert('Fetch video details first');

    // Redirect directly to browser-accessible download service
    if (quality === 'mp3') {
      window.open(`https://loader.to/api/button/?url=https://www.youtube.com/watch?v=${videoId}&f=mp3`, '_blank');
    } else {
      window.open(`https://loader.to/api/button/?url=https://www.youtube.com/watch?v=${videoId}&f=mp4`, '_blank');
    }
  }
</script>
